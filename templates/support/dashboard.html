<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service client — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="support" data-active="dashboard" data-title="Réclamations & litiges" data-subtitle="Suivi des demandes clients">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <div class="row g-3" id="stats"></div>
      <div class="card table-card mt-3">
        <div class="card-header d-flex flex-wrap gap-2 align-items-center">
          <input class="form-control form-control-sm" style="max-width:240px" type="search" placeholder="Référence, client, sujet…" data-table-filter="#tickets" aria-label="Rechercher">
          <select class="form-select form-select-sm w-auto" id="f-status" aria-label="Statut"><option value="">Tous statuts</option><option value="pending">Nouvelles</option><option value="processing">En cours</option><option value="done">Résolues</option></select>
          <select class="form-select form-select-sm w-auto" id="f-prio" aria-label="Priorité"><option value="">Toutes priorités</option><option value="haute">Haute</option><option value="moyenne">Moyenne</option><option value="basse">Basse</option></select>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover mb-0" id="tickets">
            <thead><tr><th>Référence</th><th>Client</th><th>Sujet</th><th>Type</th><th>Commande</th><th>Priorité</th><th>Agent</th><th>Statut</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const R = D.reclamations;
    const PRIO = { haute: "danger", moyenne: "warning", basse: "secondary" };
    const LBL = { pending: "Nouvelle", processing: "En cours", done: "Résolue" };
    const stat = (icon, cls, v, l) => `<div class="col-6 col-xl-3"><div class="card stat-card"><div class="stat-icon ${cls}"><i class="bi ${icon}"></i></div><div><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div></div></div>`;
    document.getElementById("stats").innerHTML =
      stat("bi-inbox", "icon-orange", R.filter((r) => r.statut === "pending").length, "Nouvelles demandes") +
      stat("bi-hourglass-split", "icon-blue", R.filter((r) => r.statut === "processing").length, "En cours") +
      stat("bi-check2-circle", "icon-green", R.filter((r) => r.statut === "done").length, "Résolues (7 j)") +
      stat("bi-stopwatch", "icon-purple", "1 h 28", "Délai moyen de 1re réponse");

    const fs = document.getElementById("f-status"), fp = document.getElementById("f-prio");
    function render() {
      document.querySelector("#tickets tbody").innerHTML = R.filter((r) => (!fs.value || r.statut === fs.value) && (!fp.value || r.priorite === fp.value)).map((r) => `
        <tr>
          <td class="fw-semibold">${esc(r.reference)}<div class="small text-muted">${esc(r.date)}</div></td>
          <td>${esc(r.client)}</td>
          <td class="small" style="max-width:260px">${esc(r.sujet)}</td>
          <td class="small">${esc(r.type)}</td>
          <td class="small">${esc(r.commande_ref)}</td>
          <td><span class="badge bg-${PRIO[r.priorite]}-subtle text-${PRIO[r.priorite]}-emphasis">${r.priorite}</span></td>
          <td class="small">${esc(r.agent || "—")}</td>
          <td>${IM.statusBadge(r.statut, LBL[r.statut])}</td>
          <td class="text-end"><a class="btn btn-sm ${r.statut === "pending" ? "btn-primary" : "btn-light"}" href="ticket.html?id=${r.id}">${r.statut === "pending" ? "Prendre en charge" : "Ouvrir"}</a></td>
        </tr>`).join("") || `<tr><td colspan="9" class="text-center text-muted py-4">Aucune demande.</td></tr>`;
    }
    fs.addEventListener("change", render); fp.addEventListener("change", render);
    render();
  </script>
</body>
</html>
