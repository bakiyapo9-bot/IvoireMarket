<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique des livraisons — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="livreur" data-active="historique" data-title="Historique des livraisons" data-subtitle="312 livraisons effectuées depuis février 2025">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <div class="card table-card">
        <div class="card-header d-flex flex-wrap gap-2">
          <input class="form-control form-control-sm" style="max-width:240px" type="search" placeholder="N°, client, boutique…" data-table-filter="#hist" aria-label="Rechercher">
          <input class="form-control form-control-sm w-auto" type="month" value="2026-11" aria-label="Mois">
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover mb-0" id="hist">
            <thead><tr><th>Colis</th><th>Date</th><th>Boutique</th><th>Client</th><th>Zone</th><th>Résultat</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { esc } = IM;
    const rows = [
      [2053, "14/11/2026 15:20", "Saveurs d'Ivoire", "Aya Konan", "Cocody / Plateau", "delivered"],
      [2040, "03/11/2026 11:05", "Beauté Karité", "Aya Konan", "Cocody / Plateau", "delivered"],
      [2037, "02/11/2026 17:42", "Pagne Royal", "Fatou Koné", "Cocody / Plateau", "delivered"],
      [2033, "01/11/2026 10:10", "Abidjan Tech", "Serge N'Guessan", "Cocody / Plateau", "failed", "Client injoignable"],
      [2031, "31/10/2026 16:30", "Maison Lagune", "Awa Sylla", "Cocody / Plateau", "delivered"],
      [2028, "30/10/2026 09:55", "Abidjan Tech", "Koffi Assi", "Cocody / Plateau", "delivered"],
    ];
    document.getElementById("rows").innerHTML = rows.map(([id, d, b, c, z, s, why]) => `
      <tr><td class="fw-semibold">#${id}</td><td class="small">${d}</td><td>${esc(b)}</td><td>${esc(c)}</td><td class="small">${esc(z)}</td>
        <td>${IM.statusBadge(s, s === "delivered" ? "Livré" : "Échec")}${why ? `<div class="small text-muted">${esc(why)}</div>` : ""}</td></tr>`).join("");
  </script>
</body>
</html>
