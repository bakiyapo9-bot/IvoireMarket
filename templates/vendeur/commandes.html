<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commandes — Espace vendeur — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="vendeur" data-active="commandes" data-title="Commandes" data-subtitle="Uniquement les sous-commandes qui concernent votre boutique">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <ul class="nav nav-pills mb-3 small" id="tabs"></ul>
      <div class="card table-card">
        <div class="card-header d-flex flex-wrap gap-2 align-items-center">
          <input class="form-control form-control-sm" style="max-width:260px" type="search" placeholder="N°, client, référence…" data-table-filter="#orders-table" aria-label="Rechercher">
          <button class="btn btn-sm btn-light ms-auto" data-demo-action="Export CSV généré." type="button"><i class="bi bi-download me-1"></i>Exporter</button>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover mb-0" id="orders-table">
            <thead><tr><th>Sous-commande</th><th>Client</th><th>Date</th><th>Articles</th><th>Montant</th><th>Commission</th><th>Net vendeur</th><th>Statut</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { esc, fmt } = IM;
    const orders = IM.subOrders(1);
    const TABS = [["", "Toutes"], ["pending", "En attente"], ["confirmed", "Confirmées"], ["processing", "En préparation"], ["shipped", "En livraison"], ["delivered", "Livrées"], ["cancelled", "Annulées"]];
    let current = IM.param("statut") || "";
    function render() {
      document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => {
        const n = orders.filter((o) => !k || o.sc.statut === k).length;
        return `<li class="nav-item"><button class="nav-link py-1 ${k === current ? "active" : ""}" data-tab="${k}">${l} <span class="badge ${k === current ? "bg-white text-orange" : "bg-light text-muted"}">${n}</span></button></li>`;
      }).join("");
      const list = orders.filter((o) => !current || o.sc.statut === current);
      document.querySelector("#orders-table tbody").innerHTML = list.map((o) => `
        <tr>
          <td><div class="fw-semibold">#${o.sc.id}</div><small class="text-muted">${esc(o.commande.reference)}</small></td>
          <td>${esc(o.commande.client)}</td>
          <td class="small text-muted">${esc(o.commande.date)}</td>
          <td>${o.sc.lignes.reduce((n, l) => n + l.quantite, 0)}</td>
          <td class="fw-semibold">${fmt(o.montant)}</td>
          <td class="text-danger small">-${fmt(o.commission)}</td>
          <td class="text-green fw-semibold">${fmt(o.net)}</td>
          <td>${IM.statusBadge(o.sc.statut)}</td>
          <td class="text-end"><a href="commande.html?id=${o.sc.id}" class="btn btn-sm btn-primary">Traiter</a></td>
        </tr>`).join("") || `<tr><td colspan="9" class="text-center text-muted py-4">Aucune commande.</td></tr>`;
    }
    document.addEventListener("click", (e) => { const t = e.target.closest("[data-tab]"); if (t) { current = t.dataset.tab; render(); } });
    render();
  </script>
</body>
</html>
