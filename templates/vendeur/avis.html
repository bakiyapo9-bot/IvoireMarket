<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avis clients — Espace vendeur — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="vendeur" data-active="avis" data-title="Avis clients" data-subtitle="Note moyenne de la boutique : 4,6 / 5 (128 avis)">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <div class="d-grid gap-3" id="reviews"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const mine = D.avis.filter((a) => IM.getProduct(a.produit_id).boutique_id === 1 && a.statut === "publie");
    document.getElementById("reviews").innerHTML = mine.map((a) => {
      const p = IM.getProduct(a.produit_id);
      return `
      <div class="card"><div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2">
          <div class="d-flex gap-2 align-items-center"><span class="avatar bg-orange">${IM.initials(a.auteur)}</span>
            <div><strong class="small">${esc(a.auteur)}</strong><div>${IM.stars(a.note)}</div></div></div>
          <div class="text-end small text-muted">${new Date(a.date).toLocaleDateString("fr-FR")}<br><a href="../produit.html?id=${p.id}">${esc(p.nom)}</a></div>
        </div>
        <p class="small mt-2 mb-2">${esc(a.commentaire)}</p>
        <!-- Django : POST {% url 'vendeur:avis_repondre' avis.id %} -->
        <form class="d-flex gap-2 needs-validation" novalidate data-demo-message="Réponse publiée sous l'avis." data-demo-reset>
          <input class="form-control form-control-sm" name="reponse" placeholder="Répondre publiquement…" required aria-label="Réponse">
          <button class="btn btn-sm btn-outline-primary text-nowrap" type="submit">Répondre</button>
          <button class="btn btn-sm btn-light text-nowrap" type="button" data-demo-action="Avis signalé à la modération." title="Signaler"><i class="bi bi-flag"></i></button>
        </form>
      </div></div>`;
    }).join("");
  </script>
</body>
</html>
