<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes produits — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="vendeur" data-active="produits" data-title="Mes produits" data-subtitle="Catalogue, prix, stocks et promotions">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <div class="card table-card">
        <div class="card-header d-flex flex-wrap gap-2 align-items-center">
          <input class="form-control form-control-sm" style="max-width:260px" type="search" placeholder="Rechercher un produit…" data-table-filter="#products-table" aria-label="Rechercher">
          <select class="form-select form-select-sm w-auto" id="status-filter" aria-label="Statut">
            <option value="">Tous les statuts</option><option value="active">Actifs</option><option value="inactive">Désactivés</option><option value="pending">En attente de validation</option><option value="rupture">En rupture</option>
          </select>
          <a href="produit-form.html" class="btn btn-primary btn-sm ms-auto"><i class="bi bi-plus-lg me-1"></i>Ajouter un produit</a>
        </div>
        <div class="card-body table-responsive">
          <!-- Django : Produit.objects.filter(boutique__vendeur=request.user) -->
          <table class="table table-hover mb-0" id="products-table">
            <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Ventes</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc, fmt } = IM;
    // Démo : la boutique 1 + un produit "en attente" et un "désactivé" pour illustrer les statuts
    const products = D.produits.filter((p) => p.boutique_id === 1).map((p) => ({ ...p }));
    products.push({ ...D.produits[13], id: 99, nom: "Clé USB 64 Go", boutique_id: 1, categorie_id: 2, icone: "bi-usb-drive", couleur: "#607d8b", prix: 5000, prix_promo: null, stock: 40, ventes: 0, statut: "pending" });
    products.push({ ...D.produits[2], id: 98, nom: "Coque iPhone 15 silicone", statut: "inactive", stock: 22, ventes: 31, prix: 4000, prix_promo: null, icone: "bi-phone-flip", couleur: "#9e9e9e" });

    const tbody = document.querySelector("#products-table tbody");
    const statusSel = document.getElementById("status-filter");
    const LBL = { active: "Actif", inactive: "Désactivé", pending: "En validation" };
    function render() {
      const f = statusSel.value;
      tbody.innerHTML = products.filter((p) => !f || (f === "rupture" ? p.stock === 0 : p.statut === f)).map((p) => `
        <tr data-id="${p.id}">
          <td><div class="d-flex gap-2 align-items-center">${IM.thumb(p, "xs")}<div class="min-w-0"><div class="fw-medium text-truncate" style="max-width:240px">${esc(p.nom)}</div>
            <small class="text-muted">Réf. PRD-${String(p.id).padStart(4, "0")}${Object.keys(p.variantes).length ? ` · ${Object.values(p.variantes).reduce((n, v) => n * v.length, 1)} variantes` : ""}</small></div></div></td>
          <td class="small">${IM.getCategory(p.categorie_id).nom}</td>
          <td><div class="fw-semibold">${fmt(IM.price(p))}</div>${p.prix_promo ? `<small class="price-old">${fmt(p.prix)}</small> <span class="badge bg-danger">-${IM.discount(p)}%</span>` : ""}</td>
          <td><span class="${p.stock === 0 ? "text-danger fw-semibold" : p.stock <= 5 ? "text-warning fw-semibold" : ""}">${p.stock}</span></td>
          <td>${p.ventes}</td>
          <td data-status-cell>${IM.statusBadge(p.statut, LBL[p.statut])}</td>
          <td class="text-end text-nowrap">
            <a href="produit-form.html?id=${p.id}" class="btn btn-sm btn-light" title="Modifier" aria-label="Modifier"><i class="bi bi-pencil"></i></a>
            ${p.statut === "pending" ? "" : `<button class="btn btn-sm btn-light" data-toggle-status="${p.id}" title="${p.statut === "active" ? "Désactiver" : "Activer"}" aria-label="Activer / désactiver"><i class="bi ${p.statut === "active" ? "bi-eye-slash" : "bi-eye"}"></i></button>`}
            <a href="../produit.html?id=${p.id}" class="btn btn-sm btn-light" title="Voir en ligne" aria-label="Voir en ligne" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i></a>
            <button class="btn btn-sm btn-light text-danger" data-delete="${p.id}" title="Supprimer" aria-label="Supprimer"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join("") || `<tr><td colspan="7" class="text-center text-muted py-4">Aucun produit.</td></tr>`;
    }
    statusSel.addEventListener("change", render);
    tbody.addEventListener("click", (e) => {
      const t = e.target.closest("[data-toggle-status]");
      if (t) {
        const p = products.find((x) => x.id === Number(t.dataset.toggleStatus));
        p.statut = p.statut === "active" ? "inactive" : "active";
        IM.toast(`« ${esc(p.nom)} » ${p.statut === "active" ? "activé" : "désactivé"}.`, "info");
        render(); return;
      }
      const d = e.target.closest("[data-delete]");
      if (d && confirm("Supprimer définitivement ce produit ? Les commandes passées conservent leurs informations.")) {
        products.splice(products.findIndex((x) => x.id === Number(d.dataset.delete)), 1);
        IM.toast("Produit supprimé.", "success"); render();
      }
    });
    render();
  </script>
</body>
</html>
