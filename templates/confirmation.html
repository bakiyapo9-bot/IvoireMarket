<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande confirmée — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../static/css/style.css" rel="stylesheet">
</head>
<body data-root="">
  <header id="site-header"></header>

  <main class="container py-4">
    <div class="checkout-steps col-lg-6 mx-auto mb-4">
      <div class="step done"><div class="dot"><i class="bi bi-check"></i></div>Panier</div>
      <div class="step done"><div class="dot"><i class="bi bi-check"></i></div>Livraison & paiement</div>
      <div class="step active"><div class="dot">3</div>Confirmation</div>
    </div>

    <div class="col-lg-9 mx-auto" id="confirm-root"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/data.js"></script>
  <script src="../static/js/app.js"></script>
  <script>
    const { esc, fmt } = IM;
    const o = IM.storage.get("im_last_order", null);
    const root = document.getElementById("confirm-root");
    if (!o) {
      root.innerHTML = `<div class="card empty-state"><i class="bi bi-receipt"></i><h5 class="mt-3">Aucune commande récente</h5>
        <a href="compte/commandes.html" class="btn btn-primary mt-2">Voir mes commandes</a></div>`;
    } else {
      root.innerHTML = `
      <div class="card text-center mb-4">
        <div class="card-body p-4 p-md-5">
          <div class="display-3 text-green"><i class="bi bi-check-circle-fill"></i></div>
          <h1 class="h3 fw-bold mt-2">Merci, votre commande est confirmée !</h1>
          <p class="text-muted">Référence <strong class="text-dark">${esc(o.reference)}</strong> · ${esc(o.date)}</p>
          <p class="small text-muted mb-0">Une notification de confirmation vous a été envoyée. Chaque vendeur a été notifié de sa sous-commande.</p>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-md-7">
          <div class="card h-100">
            <div class="card-header">Détail : ${o.sous_commandes.length} sous-commande${o.sous_commandes.length > 1 ? "s" : ""}</div>
            <div class="card-body">
              ${o.sous_commandes.map((s) => `
                <div class="border rounded-3 p-3 mb-3 vendor-group">
                  <div class="d-flex justify-content-between mb-2"><strong class="small"><i class="bi bi-shop text-green me-1"></i>${esc(s.boutique)}</strong>${IM.statusBadge(s.statut)}</div>
                  ${s.lignes.map((l) => `<div class="d-flex justify-content-between small"><span>${l.quantite} × ${esc(l.nom)}${l.variante ? ` <span class="text-muted">(${esc(l.variante)})</span>` : ""}</span><span>${fmt(l.quantite * l.prix_unitaire)}</span></div>`).join("")}
                  <div class="text-muted small mt-1">Sous-commande n° ${s.id}</div>
                </div>`).join("")}
            </div>
          </div>
        </div>
        <div class="col-md-5">
          <div class="card mb-3">
            <div class="card-header">Paiement</div>
            <div class="card-body small">
              <div class="d-flex justify-content-between mb-1"><span>Sous-total</span><span>${fmt(o.sous_total)}</span></div>
              <div class="d-flex justify-content-between mb-1"><span>Livraison</span><span>${fmt(o.frais_livraison)}</span></div>
              ${o.remise ? `<div class="d-flex justify-content-between mb-1 text-green"><span>Remise</span><span>-${fmt(o.remise)}</span></div>` : ""}
              <hr class="my-2"><div class="d-flex justify-content-between fw-bold fs-6"><span>Total</span><span class="text-orange">${fmt(o.total)}</span></div>
              <div class="mt-2">${esc(o.moyen_paiement)} · ${IM.statusBadge(o.paiement_statut, o.paiement_statut === "paid" ? "Payé" : "À payer à la livraison")}</div>
              ${o.transaction ? `<div class="text-muted mt-1">Transaction : ${esc(o.transaction)}</div>` : ""}
            </div>
          </div>
          <div class="card">
            <div class="card-header">Livraison</div>
            <div class="card-body small">
              <div><i class="bi bi-geo-alt text-orange me-1"></i>${esc(o.adresse)}</div>
              <div class="mt-1"><i class="bi bi-truck text-orange me-1"></i>${esc(o.zone)} — délai estimé ${esc(o.delai)}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-center mt-4">
        <a href="compte/commandes.html" class="btn btn-primary">Suivre mes commandes</a>
        <a href="catalogue.html" class="btn btn-outline-primary">Continuer mes achats</a>
      </div>`;
    }
  </script>
</body>
</html>
