<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-active="notifications">
  <header id="site-header"></header>

  <main class="container py-4">
    <div class="row g-4">
      <aside class="col-lg-3" id="account-nav"></aside>
      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 fw-bold mb-0">Notifications</h1>
          <button class="btn btn-sm btn-outline-primary" id="mark-all"><i class="bi bi-check2-all me-1"></i>Tout marquer comme lu</button>
        </div>
        <!-- Django : Notification.objects.filter(destinataire=request.user).order_by("-date") -->
        <div class="card"><div class="list-group list-group-flush" id="notif-list"></div></div>

        <div class="card mt-4">
          <div class="card-header">Préférences de notification</div>
          <div class="card-body">
            <form class="row g-2" method="post">
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n1" checked disabled><label class="form-check-label" for="n1">Dans l'application (toujours actif)</label></div></div>
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n2" name="email"><label class="form-check-label" for="n2">Par e-mail <span class="badge bg-light text-muted">bientôt</span></label></div></div>
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n3" name="sms"><label class="form-check-label" for="n3">Par SMS <span class="badge bg-light text-muted">bientôt</span></label></div></div>
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n4" name="promotions" checked><label class="form-check-label" for="n4">Recevoir les promotions</label></div></div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const COLORS = { commande: "icon-orange", paiement: "icon-green", livraison: "icon-blue", statut: "icon-green", promotion: "icon-purple" };
    const list = D.notifications.map((n) => ({ ...n }));
    function render() {
      document.getElementById("notif-list").innerHTML = list.map((n) => `
        <div class="list-group-item notif-item d-flex gap-3 py-3 ${n.lu ? "" : "unread"}" data-id="${n.id}">
          <div class="notif-icon ${COLORS[n.type]}"><i class="bi ${n.icone}"></i></div>
          <div class="flex-fill">
            <div class="d-flex justify-content-between"><strong class="small">${esc(n.titre)}</strong><small class="text-muted">${esc(n.date)}</small></div>
            <div class="small text-muted">${esc(n.message)}</div>
          </div>
          ${n.lu ? "" : `<button class="btn btn-sm btn-link text-muted p-0 align-self-center" data-read="${n.id}" title="Marquer comme lu" aria-label="Marquer comme lu"><i class="bi bi-check2"></i></button>`}
        </div>`).join("");
    }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-read]");
      if (b) { list.find((n) => n.id === Number(b.dataset.read)).lu = true; render(); }
    });
    document.getElementById("mark-all").addEventListener("click", () => { list.forEach((n) => (n.lu = true)); render(); IM.toast("Toutes les notifications sont lues.", "info"); });
    document.querySelectorAll("form input[type=checkbox]").forEach((i) => i.addEventListener("change", () => IM.toast("Préférences enregistrées.", "success")));
    render();
  </script>
</body>
</html>
