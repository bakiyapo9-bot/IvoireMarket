<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes réclamations — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-active="reclamations">
  <header id="site-header"></header>

  <main class="container py-4">
    <div class="row g-4">
      <aside class="col-lg-3" id="account-nav"></aside>
      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 fw-bold mb-0">Mes réclamations</h1>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newModal"><i class="bi bi-plus-lg me-1"></i>Nouvelle réclamation</button>
        </div>

        <div class="row g-3">
          <div class="col-md-5"><div class="list-group" id="rec-list"></div></div>
          <div class="col-md-7"><div class="card h-100" id="rec-detail"></div></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Nouvelle réclamation -->
  <div class="modal fade" id="newModal" tabindex="-1" aria-labelledby="newTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <!-- Django : POST multipart {% url 'support:reclamation_creer' %} -->
      <form class="modal-content needs-validation" novalidate method="post" enctype="multipart/form-data" data-demo-message="Réclamation envoyée. Un agent vous répondra sous 24 h." data-demo-reset>
        <div class="modal-header"><h5 class="modal-title" id="newTitle">Nouvelle réclamation</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body row g-3">
          <div class="col-md-6"><label class="form-label" for="r-cmd">Commande concernée</label><select class="form-select" id="r-cmd" name="commande" required><option value="">Choisir…</option></select><div class="invalid-feedback">Obligatoire.</div></div>
          <div class="col-md-6"><label class="form-label" for="r-type">Type</label>
            <select class="form-select" id="r-type" name="type" required><option value="">Choisir…</option><option>Produit endommagé</option><option>Produit non conforme</option><option>Colis non reçu</option><option>Paiement</option><option>Remboursement</option><option>Litige vendeur</option><option>Autre</option></select>
            <div class="invalid-feedback">Obligatoire.</div></div>
          <div class="col-12"><label class="form-label" for="r-sujet">Sujet</label><input class="form-control" id="r-sujet" name="sujet" required maxlength="150"><div class="invalid-feedback">Obligatoire.</div></div>
          <div class="col-12"><label class="form-label" for="r-msg">Description</label><textarea class="form-control" id="r-msg" name="message" rows="4" required minlength="20"></textarea><div class="invalid-feedback">20 caractères minimum.</div></div>
          <div class="col-12"><label class="form-label" for="r-file">Photos / justificatifs</label><input class="form-control" type="file" id="r-file" name="pieces_jointes" multiple accept="image/*,.pdf" data-preview="#r-prev"><div class="preview-grid d-flex flex-wrap gap-2 mt-2" id="r-prev"></div></div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Annuler</button><button class="btn btn-primary" type="submit">Envoyer</button></div>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const mine = D.reclamations.filter((r) => r.client === "Aya Konan");
    const cmd = document.getElementById("r-cmd");
    D.commandes.filter((c) => c.client_id === 201).forEach((c) => cmd.add(new Option(`${c.reference} — ${c.date.slice(0, 10)}`, c.reference)));
    if (IM.param("commande")) { cmd.value = IM.param("commande"); new bootstrap.Modal("#newModal").show(); }

    const PRIO = { haute: "danger", moyenne: "warning", basse: "secondary" };
    function list(active) {
      document.getElementById("rec-list").innerHTML = mine.length ? mine.map((r) => `
        <button class="list-group-item list-group-item-action ${r.id === active ? "active bg-orange-soft text-dark border-warning" : ""}" data-rec="${r.id}">
          <div class="d-flex justify-content-between"><strong class="small">${esc(r.reference)}</strong>${IM.statusBadge(r.statut, { pending: "Nouvelle", processing: "En cours", done: "Résolue" }[r.statut])}</div>
          <div class="small text-truncate">${esc(r.sujet)}</div>
          <small class="text-muted">${esc(r.type)} · ${esc(r.date)}</small>
        </button>`).join("") : `<div class="card empty-state"><i class="bi bi-chat-left-dots"></i><p class="mt-2 mb-0">Aucune réclamation.</p></div>`;
    }
    function detail(id) {
      const r = mine.find((x) => x.id === id);
      const el = document.getElementById("rec-detail");
      if (!r) { el.innerHTML = `<div class="empty-state"><i class="bi bi-chat-square-text"></i><p class="mt-2">Sélectionnez une réclamation.</p></div>`; return; }
      el.innerHTML = `
        <div class="card-header d-flex justify-content-between align-items-center"><span>${esc(r.sujet)}</span><span class="badge bg-${PRIO[r.priorite]}-subtle text-${PRIO[r.priorite]}-emphasis">Priorité ${r.priorite}</span></div>
        <div class="card-body d-flex flex-column gap-2" style="max-height:380px;overflow-y:auto">
          <div class="small text-muted mb-2">Commande ${esc(r.commande_ref)} · Agent : ${esc(r.agent || "en attente d'affectation")}</div>
          ${r.messages.map((m) => `<div class="msg ${m.role === "agent" ? "from-agent" : "from-client"}"><div class="small fw-semibold">${esc(m.auteur)}${m.role === "agent" ? ' <span class="badge bg-orange">Service client</span>' : ""}</div>${esc(m.texte)}<div class="text-muted" style="font-size:.7rem">${esc(m.date)}</div></div>`).join("")}
        </div>
        ${r.statut !== "done" ? `<div class="card-footer bg-white">
          <form class="d-flex gap-2 needs-validation" novalidate data-demo-message="Message envoyé au service client." data-demo-reset>
            <input class="form-control" name="message" placeholder="Votre message…" required aria-label="Message">
            <button class="btn btn-primary" type="submit" aria-label="Envoyer"><i class="bi bi-send"></i></button>
          </form></div>` : `<div class="card-footer bg-white small text-green"><i class="bi bi-check-circle me-1"></i>Cette demande est résolue.</div>`}`;
      // Les formulaires ajoutés dynamiquement ont besoin de leur propre gestion
      el.querySelector("form")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.currentTarget;
        if (!f.checkValidity()) { f.classList.add("was-validated"); return; }
        r.messages.push({ auteur: "Aya Konan", role: "client", date: new Date().toLocaleString("fr-FR"), texte: f.message.value });
        detail(id);
        IM.toast("Message envoyé au service client.", "success");
      });
    }
    document.addEventListener("click", (e) => { const b = e.target.closest("[data-rec]"); if (b) { list(Number(b.dataset.rec)); detail(Number(b.dataset.rec)); } });
    list(mine[0]?.id); detail(mine[0]?.id);
  </script>
</body>
</html>
