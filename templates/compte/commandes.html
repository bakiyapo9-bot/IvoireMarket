<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes commandes — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-active="commandes">
  <header id="site-header"></header>

  <main class="container py-4">
    <div class="row g-4">
      <aside class="col-lg-3" id="account-nav"></aside>
      <section class="col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 class="h4 fw-bold mb-0">Mes commandes</h1>
          <ul class="nav nav-pills small" id="status-tabs">
            <li class="nav-item"><button class="nav-link active py-1" data-filter="">Toutes</button></li>
            <li class="nav-item"><button class="nav-link py-1" data-filter="encours">En cours</button></li>
            <li class="nav-item"><button class="nav-link py-1" data-filter="delivered">Livrées</button></li>
            <li class="nav-item"><button class="nav-link py-1" data-filter="cancelled">Annulées</button></li>
          </ul>
        </div>
        <!-- Django : Commande.objects.filter(client=request.user) — un client ne voit que SES commandes -->
        <div id="orders" class="d-grid gap-3"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc, fmt } = IM;
    const orders = D.commandes.filter((c) => c.client_id === 201);
    const last = IM.storage.get("im_last_order", null); // commande passée pendant la démo

    function card(c, isNew) {
      const count = c.sous_commandes.reduce((n, s) => n + s.lignes.reduce((m, l) => m + l.quantite, 0), 0);
      const total = isNew ? c.total : IM.orderTotal(c);
      return `
      <div class="card">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <div>
              <div class="fw-semibold">${esc(c.reference)} ${isNew ? '<span class="badge bg-orange ms-1">Nouvelle</span>' : ""}</div>
              <small class="text-muted">${esc(c.date)} · ${count} article${count > 1 ? "s" : ""} · ${c.sous_commandes.length} boutique${c.sous_commandes.length > 1 ? "s" : ""}</small>
            </div>
            <div class="text-end"><div class="price">${fmt(total)}</div>${IM.statusBadge(c.statut)}</div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-3">
            ${c.sous_commandes.map((s) => {
              const nom = isNew ? s.boutique : IM.getShop(s.boutique_id).nom;
              return `<span class="badge bg-light text-dark border fw-normal py-2 px-3"><i class="bi bi-shop text-green me-1"></i>${esc(nom)} · ${IM.STATUS[s.statut]}</span>`;
            }).join("")}
          </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-2">
          ${isNew ? `<a href="../confirmation.html" class="btn btn-sm btn-outline-primary">Voir le récapitulatif</a>`
            : `<a href="commande.html?id=${c.id}" class="btn btn-sm btn-primary">Détails & suivi</a>`}
        </div>
      </div>`;
    }

    function render(filter) {
      const match = (c) => !filter || (filter === "encours" ? ["pending", "confirmed", "paid", "processing", "shipped"].includes(c.statut) : filter === "cancelled" ? ["cancelled", "failed"].includes(c.statut) : c.statut === filter);
      const html = [last && match(last) ? card(last, true) : "", ...orders.filter(match).map((c) => card(c))].join("");
      document.getElementById("orders").innerHTML = html || `<div class="card empty-state"><i class="bi bi-receipt"></i><p class="mt-2 mb-0">Aucune commande dans cette catégorie.</p></div>`;
    }
    document.querySelectorAll("#status-tabs [data-filter]").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll("#status-tabs .nav-link").forEach((x) => x.classList.remove("active"));
      b.classList.add("active"); render(b.dataset.filter);
    }));
    render("");
  </script>
</body>
</html>
