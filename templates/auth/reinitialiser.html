<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouveau mot de passe — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body data-root="../">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card auth-form">
      <div class="card-body p-4 p-md-5">
        <a class="brand-logo d-block mb-4 text-center" href="../index.html"><i class="bi bi-bag-check-fill"></i> Ivoire<span>Market</span></a>
        <h1 class="h4 fw-bold text-center">Choisissez un nouveau mot de passe</h1>
        <p class="text-muted text-center small">8 caractères minimum, avec au moins une lettre et un chiffre.</p>
        <!-- Django : PasswordResetConfirmView — lien {% url 'password_reset_confirm' uidb64=uid token=token %} -->
        <form class="needs-validation mt-3" novalidate method="post" data-demo-message="Mot de passe modifié. Vous pouvez vous connecter." data-demo-redirect="auth/connexion.html">
          <label class="form-label" for="p1">Nouveau mot de passe</label>
          <div class="input-group mb-3">
            <input class="form-control" type="password" id="p1" name="new_password1" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" autocomplete="new-password" data-password>
            <button class="btn btn-outline-secondary" type="button" data-toggle-password aria-label="Afficher"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback">8 caractères avec lettres et chiffres.</div>
          </div>
          <label class="form-label" for="p2">Confirmer</label>
          <input class="form-control mb-3" type="password" id="p2" name="new_password2" required autocomplete="new-password" data-password-confirm>
          <div class="invalid-feedback mb-2">Les mots de passe ne correspondent pas.</div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Enregistrer</button>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
</body>
</html>
