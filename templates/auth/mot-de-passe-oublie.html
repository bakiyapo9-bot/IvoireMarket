<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body data-root="../">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card auth-form">
      <div class="card-body p-4 p-md-5">
        <a class="brand-logo d-block mb-4 text-center" href="../index.html"><i class="bi bi-bag-check-fill"></i> Ivoire<span>Market</span></a>
        <div class="text-center mb-3"><span class="stat-icon icon-orange d-inline-flex rounded-circle" style="width:64px;height:64px;font-size:1.8rem;align-items:center;justify-content:center"><i class="bi bi-key"></i></span></div>
        <h1 class="h4 fw-bold text-center">Mot de passe oublié ?</h1>
        <p class="text-muted text-center small">Saisissez votre e-mail : nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
        <!-- Django : PasswordResetView — POST {% url 'password_reset' %} -->
        <form class="needs-validation mt-3" novalidate method="post" data-demo-message="Si un compte existe pour cette adresse, un lien de réinitialisation vient d'être envoyé." data-demo-redirect="auth/reinitialiser.html">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control form-control-lg mb-3" type="email" id="email" name="email" required autocomplete="email">
          <div class="invalid-feedback mb-2">Saisissez un e-mail valide.</div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Envoyer le lien</button>
        </form>
        <p class="text-center small mt-4 mb-0"><a href="connexion.html"><i class="bi bi-arrow-left"></i> Retour à la connexion</a></p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
</body>
</html>
