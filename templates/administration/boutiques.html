<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendeurs & boutiques — Administration — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="admin" data-active="boutiques" data-title="Vendeurs & boutiques" data-subtitle="Validation des comptes vendeurs, activation et suspension des boutiques">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <ul class="nav nav-pills small mb-3" id="tabs"></ul>
      <div class="card table-card">
        <div class="card-header"><input class="form-control form-control-sm" style="max-width:260px" type="search" placeholder="Rechercher une boutique…" data-table-filter="#shops" aria-label="Rechercher"></div>
        <div class="card-body table-responsive">
          <table class="table table-hover mb-0" id="shops">
            <thead><tr><th>Boutique</th><th>Vendeur</th><th>Localisation</th><th>Produits</th><th>Note</th><th>Créée le</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Détail / validation -->
  <div class="modal fade" id="shopModal" tabindex="-1" aria-labelledby="shopTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="shopTitle">Dossier boutique</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
      <div class="modal-body" id="shop-body"></div>
      <div class="modal-footer" id="shop-actions"></div>
    </div></div>
  </div>

  <!-- Motif de rejet / suspension -->
  <div class="modal fade" id="reasonModal" tabindex="-1" aria-labelledby="reasonTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" novalidate id="reason-form">
        <div class="modal-header"><h5 class="modal-title" id="reasonTitle">Motif</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body">
          <p class="small text-muted">Ce motif sera communiqué au vendeur et conservé dans l'historique.</p>
          <textarea class="form-control" name="motif" id="reason" rows="3" required minlength="10" aria-label="Motif"></textarea>
          <div class="invalid-feedback">10 caractères minimum.</div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Annuler</button><button class="btn btn-danger" type="submit">Confirmer</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const shops = D.boutiques.map((b) => ({ ...b }));
    const sellers = Object.fromEntries(D.utilisateurs.filter((u) => u.role === "vendeur").map((u) => [u.id, u]));
    const LBL = { active: "Active", pending: "À valider", suspended: "Suspendue", rejected: "Rejetée" };
    let tab = IM.param("statut") || "";
    let pendingAction = null;
    const shopModal = new bootstrap.Modal("#shopModal");
    const reasonModal = new bootstrap.Modal("#reasonModal");

    function render() {
      document.getElementById("tabs").innerHTML = [["", "Toutes"], ["pending", "À valider"], ["active", "Actives"], ["suspended", "Suspendues"], ["rejected", "Rejetées"]].map(([k, l]) =>
        `<li class="nav-item"><button class="nav-link py-1 ${k === tab ? "active" : ""}" data-tab="${k}">${l} <span class="badge ${k === tab ? "bg-white text-orange" : "bg-light text-muted"}">${shops.filter((s) => !k || s.statut === k).length}</span></button></li>`).join("");
      document.querySelector("#shops tbody").innerHTML = shops.filter((s) => !tab || s.statut === tab).map((s) => `
        <tr>
          <td><div class="d-flex gap-2 align-items-center">${IM.shopLogo(s, "avatar")}<div class="fw-medium">${esc(s.nom)}</div></div></td>
          <td class="small">${esc(sellers[s.vendeur_id]?.nom || "Vendeur #" + s.vendeur_id)}<br><span class="text-muted">${esc(s.email)}</span></td>
          <td class="small">${esc(s.commune)}, ${esc(s.ville)}</td>
          <td>${s.nb_produits}</td>
          <td class="small">${s.nb_avis ? `${IM.stars(s.note)} ${s.note.toFixed(1)}` : "—"}</td>
          <td class="small">${new Date(s.date_creation).toLocaleDateString("fr-FR")}</td>
          <td>${IM.statusBadge(s.statut, LBL[s.statut])}</td>
          <td class="text-end"><button class="btn btn-sm ${s.statut === "pending" ? "btn-primary" : "btn-light"}" data-open="${s.id}">${s.statut === "pending" ? "Examiner" : "Gérer"}</button></td>
        </tr>`).join("") || `<tr><td colspan="8" class="text-center text-muted py-4">Aucune boutique.</td></tr>`;
    }

    function open(id) {
      const s = shops.find((x) => x.id === id);
      const v = sellers[s.vendeur_id];
      document.getElementById("shopTitle").textContent = s.nom;
      document.getElementById("shop-body").innerHTML = `
        <div class="rounded-3 mb-3" style="height:80px;background:linear-gradient(120deg, ${s.couleur}, ${s.couleur}77)"></div>
        <div class="row g-3 small">
          <div class="col-md-6"><h6 class="fw-semibold">Boutique</h6>
            <div><strong>Description :</strong> ${esc(s.description)}</div>
            <div class="mt-1"><strong>Catégories :</strong> ${s.categories.map((c) => IM.getCategory(c).nom).join(", ")}</div>
            <div class="mt-1"><strong>Adresse :</strong> ${esc(s.commune)}, ${esc(s.ville)}</div>
            <div class="mt-1"><strong>Contact :</strong> ${esc(s.telephone)} · ${esc(s.email)}</div></div>
          <div class="col-md-6"><h6 class="fw-semibold">Vendeur</h6>
            <div><strong>Nom :</strong> ${esc(v?.nom || "—")}</div>
            <div class="mt-1"><strong>Compte :</strong> ${v ? IM.statusBadge(v.statut, LBL[v.statut] || v.statut) : "—"}</div>
            <h6 class="fw-semibold mt-3">Justificatifs</h6>
            <div class="d-flex flex-column gap-1">
              <a href="#" class="d-flex align-items-center gap-2"><i class="bi bi-file-earmark-person text-orange"></i>Pièce d'identité.pdf</a>
              <a href="#" class="d-flex align-items-center gap-2"><i class="bi bi-file-earmark-text text-orange"></i>RCCM.pdf</a>
            </div></div>
        </div>
        ${s.statut === "pending" ? `<div class="alert alert-warning small mt-3 mb-0"><i class="bi bi-info-circle me-1"></i>Vérifiez les justificatifs avant validation. La validation active à la fois le compte vendeur et la boutique.</div>` : ""}`;
      const btn = (act, cls, label) => `<button class="btn ${cls}" data-act="${act}" data-id="${s.id}">${label}</button>`;
      document.getElementById("shop-actions").innerHTML = ({
        pending: btn("rejected", "btn-outline-danger", "Rejeter") + btn("active", "btn-success", '<i class="bi bi-check-lg me-1"></i>Valider la boutique'),
        active: `<a class="btn btn-light me-auto" href="../boutique.html?id=${s.id}" target="_blank" rel="noopener">Voir la boutique</a>` + btn("suspended", "btn-outline-danger", "Suspendre"),
        suspended: btn("active", "btn-success", "Réactiver"),
        rejected: btn("pending", "btn-light", "Remettre en examen"),
      })[s.statut];
      shopModal.show();
    }

    function apply(id, statut, motif) {
      const s = shops.find((x) => x.id === id);
      s.statut = statut;
      if (statut === "active" && sellers[s.vendeur_id]) sellers[s.vendeur_id].statut = "active";
      IM.toast(`${esc(s.nom)} : ${LBL[statut]}.${motif ? " Motif transmis au vendeur." : ""} Le vendeur a été notifié.`, statut === "active" ? "success" : "info");
      render();
    }

    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; render(); return; }
      const o = e.target.closest("[data-open]"); if (o) { open(Number(o.dataset.open)); return; }
      const a = e.target.closest("[data-act]");
      if (a) {
        shopModal.hide();
        if (["rejected", "suspended"].includes(a.dataset.act)) {
          pendingAction = [Number(a.dataset.id), a.dataset.act];
          document.getElementById("reasonTitle").textContent = a.dataset.act === "rejected" ? "Motif du rejet" : "Motif de la suspension";
          reasonModal.show();
        } else apply(Number(a.dataset.id), a.dataset.act);
      }
    });
    document.getElementById("reason-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!e.currentTarget.checkValidity()) { e.currentTarget.classList.add("was-validated"); return; }
      reasonModal.hide();
      apply(...pendingAction, document.getElementById("reason").value);
      e.currentTarget.reset(); e.currentTarget.classList.remove("was-validated");
    });
    render();
  </script>
</body>
</html>
