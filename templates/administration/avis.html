<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modération des avis — Administration — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="admin" data-active="avis" data-title="Modération des avis" data-subtitle="Avis signalés, en attente et publiés">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <ul class="nav nav-pills small mb-3" id="tabs"></ul>
      <div class="d-grid gap-3" id="list"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const reviews = D.avis.map((a) => ({ ...a }));
    let tab = "signale";
    const TABS = [["signale", "Signalés", (a) => a.signale], ["en_attente", "En attente", (a) => a.statut === "en_attente"], ["publie", "Publiés", (a) => a.statut === "publie"], ["masque", "Masqués", (a) => a.statut === "masque"]];
    function render() {
      document.getElementById("tabs").innerHTML = TABS.map(([k, l, f]) => `<li class="nav-item"><button class="nav-link py-1 ${k === tab ? "active" : ""}" data-tab="${k}">${l} <span class="badge ${k === tab ? "bg-white text-orange" : "bg-light text-muted"}">${reviews.filter(f).length}</span></button></li>`).join("");
      const f = TABS.find((t) => t[0] === tab)[2];
      document.getElementById("list").innerHTML = reviews.filter(f).map((a) => {
        const p = IM.getProduct(a.produit_id);
        return `
        <div class="card ${a.signale ? "border-danger-subtle" : ""}"><div class="card-body">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <div class="d-flex gap-2 align-items-center"><span class="avatar bg-orange">${IM.initials(a.auteur)}</span>
              <div><strong class="small">${esc(a.auteur)}</strong> ${IM.stars(a.note)}<div class="small text-muted">sur <a href="../produit.html?id=${p.id}">${esc(p.nom)}</a> · ${esc(IM.getShop(p.boutique_id).nom)}</div></div></div>
            <div class="small text-muted">${new Date(a.date).toLocaleDateString("fr-FR")}</div>
          </div>
          <p class="small mt-2 mb-2">${esc(a.commentaire)}</p>
          ${a.signale ? `<div class="alert alert-danger small py-2 mb-2"><i class="bi bi-flag-fill me-1"></i>Signalé 3 fois — motifs : informations personnelles, contenu injurieux.</div>` : ""}
          <div class="d-flex flex-wrap gap-2">
            ${a.statut !== "publie" || a.signale ? `<button class="btn btn-sm btn-success" data-mod="${a.id}" data-to="publie"><i class="bi bi-check-lg me-1"></i>${a.signale ? "Conserver (signalement infondé)" : "Publier"}</button>` : ""}
            ${a.statut !== "masque" ? `<button class="btn btn-sm btn-outline-danger" data-mod="${a.id}" data-to="masque"><i class="bi bi-eye-slash me-1"></i>Masquer</button>` : ""}
            <button class="btn btn-sm btn-light" data-demo-action="Avertissement envoyé à ${esc(a.auteur)}."><i class="bi bi-exclamation-triangle me-1"></i>Avertir l'auteur</button>
          </div>
        </div></div>`;
      }).join("") || `<div class="card empty-state"><i class="bi bi-check2-circle"></i><p class="mt-2 mb-0">Aucun avis dans cette catégorie.</p></div>`;
    }
    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; render(); return; }
      const m = e.target.closest("[data-mod]");
      if (!m) return;
      const a = reviews.find((x) => x.id === Number(m.dataset.mod));
      a.statut = m.dataset.to; a.signale = false;
      IM.toast(a.statut === "publie" ? "Avis publié." : "Avis masqué du site.", "success");
      render();
    });
    render();
  </script>
</body>
</html>
