<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catégories — Administration — IvoireMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/style.css" rel="stylesheet">
</head>
<body class="dash-body" data-root="../" data-role="admin" data-active="categories" data-title="Catégories" data-subtitle="Catégories et sous-catégories du catalogue">
  <aside id="dash-sidebar"></aside>
  <div class="dash-main">
    <header id="dash-topbar"></header>
    <main class="dash-content">
      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary btn-sm" data-new-cat><i class="bi bi-plus-lg me-1"></i>Nouvelle catégorie</button>
      </div>
      <!-- Django : Categorie(parent=ForeignKey('self', null=True)) — une sous-catégorie a un parent -->
      <div class="row g-3" id="cats"></div>
    </main>
  </div>

  <div class="modal fade" id="catModal" tabindex="-1" aria-labelledby="catTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" novalidate method="post" id="cat-form">
        <div class="modal-header"><h5 class="modal-title" id="catTitle">Catégorie</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body row g-3">
          <input type="hidden" name="id" id="cat-id">
          <div class="col-12"><label class="form-label" for="cat-nom">Nom</label><input class="form-control" id="cat-nom" name="nom" required><div class="invalid-feedback">Obligatoire.</div></div>
          <div class="col-12"><label class="form-label" for="cat-parent">Catégorie parente</label><select class="form-select" id="cat-parent" name="parent"><option value="">— Aucune (catégorie principale) —</option></select></div>
          <div class="col-md-6"><label class="form-label" for="cat-icon">Icône (Bootstrap Icons)</label><input class="form-control" id="cat-icon" name="icone" placeholder="bi-bag"></div>
          <div class="col-md-6"><label class="form-label" for="cat-order">Ordre d'affichage</label><input class="form-control" type="number" id="cat-order" name="ordre" value="0"></div>
          <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="cat-actif" name="actif" checked><label class="form-check-label" for="cat-actif">Catégorie active</label></div></div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Annuler</button><button class="btn btn-primary" type="submit">Enregistrer</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/data.js"></script>
  <script src="../../static/js/app.js"></script>
  <script>
    const { D, esc } = IM;
    const cats = D.categories.map((c) => ({ ...c, sous_categories: c.sous_categories.map((s) => ({ ...s })) }));
    const count = (cid, sid) => D.produits.filter((p) => p.categorie_id === cid && (!sid || p.sous_categorie_id === sid)).length;
    const modal = new bootstrap.Modal("#catModal");
    const form = document.getElementById("cat-form");
    let nextId = 100;

    function render() {
      document.getElementById("cats").innerHTML = cats.map((c) => `
        <div class="col-md-6 col-xl-4">
          <div class="card h-100 ${c.actif ? "" : "opacity-75"}">
            <div class="card-header d-flex align-items-center gap-2">
              <span class="stat-icon icon-orange" style="width:36px;height:36px;font-size:1rem"><i class="bi ${esc(c.icone || "bi-tag")}"></i></span>
              <div class="flex-fill"><div>${esc(c.nom)}</div><small class="text-muted fw-normal">${count(c.id)} produits</small></div>
              <div class="form-check form-switch mb-0" title="Activer / désactiver"><input class="form-check-input" type="checkbox" data-toggle-cat="${c.id}" ${c.actif ? "checked" : ""} aria-label="Activer ${esc(c.nom)}"></div>
              <button class="btn btn-sm btn-light" data-edit="${c.id}" aria-label="Modifier"><i class="bi bi-pencil"></i></button>
            </div>
            <ul class="list-group list-group-flush small">
              ${c.sous_categories.map((s) => `<li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-arrow-return-right text-muted me-1"></i>${esc(s.nom)}</span>
                <span><span class="badge bg-light text-muted">${count(c.id, s.id)}</span>
                <button class="btn btn-sm btn-link p-0 ms-2 text-muted" data-edit-sub="${c.id}:${s.id}" aria-label="Modifier"><i class="bi bi-pencil"></i></button></span></li>`).join("")}
              <li class="list-group-item"><button class="btn btn-sm btn-link p-0" data-add-sub="${c.id}"><i class="bi bi-plus"></i> Ajouter une sous-catégorie</button></li>
            </ul>
          </div>
        </div>`).join("");
    }

    function openForm({ id = "", nom = "", parent = "", icone = "", actif = true, title = "Nouvelle catégorie" } = {}) {
      const sel = document.getElementById("cat-parent");
      sel.length = 1;
      cats.forEach((c) => sel.add(new Option(c.nom, c.id)));
      document.getElementById("catTitle").textContent = title;
      document.getElementById("cat-id").value = id;
      document.getElementById("cat-nom").value = nom;
      sel.value = parent;
      document.getElementById("cat-icon").value = icone;
      document.getElementById("cat-actif").checked = actif;
      form.classList.remove("was-validated");
      modal.show();
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-new-cat]")) return openForm();
      const ed = e.target.closest("[data-edit]");
      if (ed) { const c = cats.find((x) => x.id === Number(ed.dataset.edit)); return openForm({ id: c.id, nom: c.nom, icone: c.icone, actif: c.actif, title: "Modifier la catégorie" }); }
      const es = e.target.closest("[data-edit-sub]");
      if (es) { const [cid, sid] = es.dataset.editSub.split(":").map(Number); const s = cats.find((x) => x.id === cid).sous_categories.find((x) => x.id === sid);
        return openForm({ id: `${cid}:${sid}`, nom: s.nom, parent: cid, title: "Modifier la sous-catégorie" }); }
      const as = e.target.closest("[data-add-sub]");
      if (as) return openForm({ parent: Number(as.dataset.addSub), title: "Nouvelle sous-catégorie" });
    });
    document.addEventListener("change", (e) => {
      const t = e.target.closest("[data-toggle-cat]");
      if (!t) return;
      const c = cats.find((x) => x.id === Number(t.dataset.toggleCat));
      c.actif = t.checked;
      IM.toast(`Catégorie « ${esc(c.nom)} » ${c.actif ? "activée" : "désactivée"}.${c.actif ? "" : " Ses produits ne sont plus visibles dans le catalogue."}`, "info");
      render();
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!form.checkValidity()) { form.classList.add("was-validated"); return; }
      const id = document.getElementById("cat-id").value;
      const nom = document.getElementById("cat-nom").value.trim();
      const parent = Number(document.getElementById("cat-parent").value) || null;
      const icone = document.getElementById("cat-icon").value.trim() || "bi-tag";
      const actif = document.getElementById("cat-actif").checked;
      if (id.includes(":")) {
        const [cid, sid] = id.split(":").map(Number);
        cats.find((x) => x.id === cid).sous_categories.find((x) => x.id === sid).nom = nom;
      } else if (id) {
        Object.assign(cats.find((x) => x.id === Number(id)), { nom, icone, actif });
      } else if (parent) {
        cats.find((x) => x.id === parent).sous_categories.push({ id: nextId++, nom });
      } else {
        cats.push({ id: nextId++, nom, icone, actif, sous_categories: [] });
      }
      modal.hide();
      IM.toast("Catégorie enregistrée.", "success");
      render();
    });
    render();
  </script>
</body>
</html>
